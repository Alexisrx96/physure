# physure-python — PyO3 Thin Wrapper
# ─────────────────────────────────────────────────────────────────────────────
# This crate ONLY contains PyO3 bindings. No physics logic lives here.
# All math is delegated to physure-core.
# ─────────────────────────────────────────────────────────────────────────────

[package]
name        = "physure-python"
description = "PyO3 thin wrapper for physure-core. Exposes the physics engine to Python."
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
homepage.workspace   = true
authors.workspace    = true
publish     = false   # PyO3 binding crate — ships to PyPI via maturin, never to crates.io

[lib]
# Same lib name as the `physure` crate's rlib (physure-core/); both build today.
# The Python module name comes from `#[pymodule(name = "_core")]` in src/lib.rs
# and `[tool.maturin] module-name` in pyproject.toml, not from this field.
name       = "physure_core"
crate-type = ["cdylib"]      # Shared library for Python import

[dependencies]
physure-core.workspace = true
physure-script.workspace = true
pyo3.workspace         = true
numpy.workspace        = true
# Used directly by src/lib.rs (Rational64, FromPrimitive).
num-rational.workspace = true
num-traits.workspace   = true
