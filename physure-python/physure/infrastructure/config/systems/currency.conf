# Currency units, opt-in: physure.ext.currency.enable_currency() reads this file and extends a
# system with it through the core. It is not part of the default catalog (exchange rates are not
# physics, and a frozen catalog would carry them).
#
# The rates below are PLACEHOLDERS, not market data: they are the literals physure has shipped
# since currencies were added, unchanged as of 2026-11-15, and nothing updates them (no network
# fetch exists). Override them in your own conf text, for example
#     system.extend_core("[Units]\nEUR = 1.17, $, noprefix, [euros]\n")
# where a later definition of a unit replaces this one.
#
# A rate is the value of one unit in USD. Currencies take no prefix (no mUSD).

[Dimensions]
money = $, noprefix

[Units]
USD = 1.0, $, noprefix, [dollars, dolar]
EUR = 1.08, $, noprefix, [euros]
MXN = 0.059, $, noprefix, [pesos]
