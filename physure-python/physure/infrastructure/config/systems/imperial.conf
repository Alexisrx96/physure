# ===============================================
#  Imperial unit system
# ===============================================

[System]
name = Imperial
# The base units this system prefers for the most common dimensions. Not applied yet:
# the library stores this entry in `system.settings` but no code reads it, and
# conversions to base units always give the SI ones (the CHANGELOG of 0.3.0 explains why).
base_units = L:ft, M:lb, T:s
