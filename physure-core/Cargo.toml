# physure-core — The Pure Physics Engine
# ─────────────────────────────────────────────────────────────────────────────
# HARD RULE: This crate MUST NOT depend on pyo3, wasm-bindgen, or jni.
# It is the single source of truth for all physics logic.
# All FFI wrappers (physure-python, physure-wasm, physure-java) depend on this.
# ─────────────────────────────────────────────────────────────────────────────

[package]
name        = "physure"
description = "Pure Rust physics engine. No FFI dependencies. Single source of truth."
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
homepage.workspace   = true
authors.workspace    = true

[lib]
name       = "physure_core"
# rlib: used by physure-python (statically linked into the .so)
# No cdylib here — FFI wrappers declare their own crate-type.
crate-type = ["rlib"]

[dependencies]
num-rational.workspace = true
num-traits.workspace   = true
ndarray.workspace      = true
rand.workspace         = true
rand_distr.workspace   = true
nalgebra.workspace     = true
dyn-clone.workspace    = true
arrow.workspace        = true
chrono.workspace       = true
sprs.workspace         = true
smallvec.workspace     = true
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# `rand`/`rand_distr` and `arrow` (via `ahash`'s `const-random`) pull in
# getrandom 0.2, which refuses to build for wasm32-unknown-unknown unless its
# "js" feature is enabled. Not a wasm-bindgen dependency (see the hard rule
# above) — just a target-gated feature flag on a transitive dependency so
# this crate stays buildable for wasm32 on its own.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[[bench]]
name = "core_benchmarks"
harness = false

[dev-dependencies]
# Unit tests live here — lightweight test helpers only
approx = "0.5"
criterion.workspace = true
