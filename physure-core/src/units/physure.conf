# ===============================================
#  Physure Master Configuration File
# ===============================================

[Settings]
default_output = plain
auto_simplify = true
default_system = SI
readable_representation = true
verbose = false
# How uncertainties combine: correlated, uncorrelated, monte_carlo or unscented.
# Read by parse_physure_conf, so PHS and the Rust API honour it too, not just Python.
# A `physure.conf` in the working directory overrides this one.
propagation_mode = correlated
# How a conversion reads the radian and the steradian. `dimensionless` is the SI (Brochure, Table 4: both are 1 in
# an expression): `=>`, `to` and a unit annotation may identify them with 1 where [Compatibility] says so.
# `dimension` makes the angle a dimension like any other. A sum or a comparison never reads them as 1.
angle_mode = dimensionless
# Minimum element count at which a PHS `for`-expression switches from sequential to
# rayon-parallel evaluation. A `physure.conf` in the working directory overrides this one.
parallel_threshold = 10000
# Ceiling on how many elements a single `for`-expression range, or a `parallel_map` input
# vector, may materialize into memory at once. Raise this only if a legitimate workload
# needs more; it exists to stop an untrusted range/vector size from exhausting memory.
max_loop_iterations = 1000000
# Ceiling on how many steps a single PhsPipeline::execute() call may run, checked before the
# first step executes. Raise this only if a legitimate pipeline genuinely needs more steps.
max_pipeline_steps = 1000
# Ceiling on how many times one PHS `while` loop may run its body before it is an error
# ("while loop did not converge after N iterations"). A whole number of at least 1.
max_while_iterations = 10000
# The relative tolerance of PHS `≈` (and the default of `approx(a, b, rel)`): `a ≈ b` when
# |a - b| <= approx_rel_tol * max(|a|, |b|), both read in base SI (absolute K for a temperature).
# A finite number between 0 and 1 (exclusive). It is relative, so it means the same in every unit.
approx_rel_tol = 1e-3
# How many samples a Monte Carlo measurement draws when it does not name a count (every Monte Carlo
# literal of PHS; Python's Q_ in Monte Carlo mode). A whole number from 2 (the sample standard
# deviation needs two) to 10000000 (each measurement allocates this many numbers).
monte_carlo_samples = 1000
# What a bare asymmetric uncertainty (+a, -b) means: `dimidiated` (equal area: each half of the
# Gaussian carries half the probability; the reading most physicists intend) or `fechner` (equal
# height: the density is continuous at the mode). arXiv:2411.15499, appendix A.
asymmetric_shape = dimidiated
mkml_recursion_limit = 100


[Dimensions]
# --- Base Dimensions ---
length = L
mass = M
time = T
electric_current = I
temperature = O
amount_of_substance = N
luminous_intensity = J
angle = A, noprefix

# --- Derived Dimensions (Mechanics) ---
area = L^2
volume = L^3
velocity = L*T^-1
acceleration = L*T^-2
force = M*L*T^-2
pressure = M*L^-1*T^-2
energy = M*L^2*T^-2
power = M*L^2*T^-3
frequency = T^-1

# --- Derived Dimensions (Electromagnetism) ---
electric_charge = I*T
electric_potential = M*L^2*T^-3*I^-1
electric_resistance = M*L^2*T^-3*I^-2
electric_conductance = M^-1*L^-2*T^3*I^2
electric_capacitance = M^-1*L^-2*T^4*I^2
magnetic_flux = M*L^2*T^-2*I^-1
magnetic_flux_density = M*T^-2*I^-1
inductance = M*L^2*T^-2*I^-2
resistivity = M*L^3*T^-3*I^-2

# --- Derived Dimensions (Others) ---
luminous_flux = J*A
illuminance = J*A*L^-2

[Prefixes]
# Format: name = symbol, factor
quetta = Q, 1e30
ronna  = R, 1e27
yotta  = Y, 1e24
zetta  = Z, 1e21
exa    = E, 1e18
peta   = P, 1e15
tera   = T, 1e12
giga   = G, 1e9
mega   = M, 1e6
kilo   = k, 1e3
hecto  = h, 100
deca   = da, 10
deci   = d, 0.1
centi  = c, 0.01
milli  = m, 1e-3
micro  = u, 1e-6
nano   = n, 1e-9
pico   = p, 1e-12
femto  = f, 1e-15
atto   = a, 1e-18
zepto  = z, 1e-21
yocto  = y, 1e-24
ronto  = r, 1e-27
quecto = q, 1e-30

[Units]
# Names. Every entry can be written with its own name below, and no name belongs
# to two entries (tests/core/test_catalog_namespace.py). Where a quantity has
# several definitions in use, each definition has its own entry, named
# <unit>_<qualifier> (_th, _it, _iso, _us, _us_survey, _imperial, _metric,
# _electric, _julian, _gregorian...), and the short symbol is the default named
# in the comment above the group.
# Flags: `noprefix` forbids SI prefixes. `own_kind` marks a unit whose dimension symbol
# an earlier entry already holds, but which is not the same kind of quantity (steradian
# and radian share A). Without it, a later entry at scale 1 is only another name for the
# base unit of its dimension: delta_celsius is a kelvin.
# --- SPECIAL ---
# We define pH here to reserve the symbol before 'p' + 'H' (pico-Henry) occurs
pH = Log, -1, 1.0, 1, noprefix, [pH]

# --- SI Base Units ---
meter    = 1.0, L, [m, meter, metro, metros]
kilogram = 1.0, M, [kg, kilogram, kilogramo, kgs]
second   = 1.0, T, [s, sec, second, segundo, segundos]
ampere   = 1.0, I, [A, ampere, amperio, amperios]
kelvin   = 1.0, O, [K, kelvin, kelvins]

# --- Temperature Scales (absolute, affine: factor, zero-point-in-K, dimension) ---
# Absolute scales normalise to K on any arithmetic, so `T2 - T1` is a true interval.
# A degree Fahrenheit is 5/9 K and its zero is 459.67 * 5/9 = 45967/180 K above absolute
# zero: written as the fractions they are, not as rounded decimals, so that 212 degF is
# exactly 100 degC.
# Use the delta_* units below when a value is already a difference.
# The first name listed is the symbol of the unit: the one it is shown by when it is written by it.
celsius    = 1.0, 273.15, O, [°C, celsius, centigrade, degC]
fahrenheit = 5/9, 45967/180, O, [°F, fahrenheit, degF]
rankine    = 5/9, O, [degR, rankine, °R]
delta_celsius    = 1.0, O, [delta_degC, degC_delta, delta_celsius]
delta_fahrenheit = 5/9, O, [delta_degF, degF_delta, delta_fahrenheit]
mole     = 1.0, N, [mol, mole, moles]
candela  = 1.0, J, [cd, candela, candelas]

# --- Dimensionless / Supplementary Units ---
# Note: Unity '1' is dimensionless. The radian and the steradian are the base units of the angle dimension (A); the
# SI gives both the expression 1, see [Compatibility].
radian    = 1.0, A, [rad, radian, radians]
steradian = 1.0, A, own_kind, [sr, steradian, steradians]
unity     = 1.0, 1, noprefix, [1]
# A ratio is still a quantity: `5.0 %` has to carry its 0.01 factor so that
# `200.0 kPa * 5.0 %` is 10 kPa and not 1000.
percent   = 0.01, 1, [%, percent, pct, porcentaje]
ppm       = 1e-6, 1, [ppm]

# --- Currency ---

# --- LENGTH ---

