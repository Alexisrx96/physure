[package]
name        = "physure-script"
description = "PhysureScript (PHS) language engine: Lexer, Parser, AST, Interpreter, and Codegen."
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
homepage.workspace   = true
authors.workspace    = true

[lib]
name       = "physure_script"
crate-type = ["rlib"]

[dependencies]
physure-core = { path = "../physure-core", package = "physure" }
num-rational.workspace = true
num-traits.workspace   = true
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
pest        = "2.7"
pest_derive = "2.7"

# Native plugin loading (dlopen) has no wasm32 equivalent, so `libloading` is
# only pulled in for real targets; `plugin.rs` provides a no-op `PluginState`
# stub with an identical public API on wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libloading  = "0.8"
