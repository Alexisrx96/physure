sonar.projectKey=physure-cli
sonar.projectName=physure-cli
sonar.projectVersion=1.0

sonar.sources=src
sonar.tests=tests
sonar.exclusions=target/**
sonar.rust.lcov.reportPaths=lcov.info
sonar.cpd.exclusions=**/tests.rs
# Three files are shells around the terminal and the operating system, not logic a test can drive without a TTY, a
# browser or a network: the full-screen terminal UI (`tui.rs`), the local web viewer that opens a browser (`web.rs`)
# and the self-update that downloads and replaces the running binary (`upgrade.rs`, whose pure helpers have unit
# tests that these exclusions do not hide from `cargo test`). Everything else is measured.
sonar.coverage.exclusions=src/tui.rs,src/web.rs,src/upgrade.rs

sonar.host.url=http://sonar.localhost
