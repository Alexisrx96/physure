# Release pipeline: push a tag `core-vX.Y.Z` to publish the `physure` crate (physure-core/) to crates.io.
#
# physure-core is versioned independently from the physure Python wrapper
# (see release.yml / bump-release.yml, triggered by plain `vX.Y.Z` tags).
#
# One-time setup (repo owner):
#   1. crates.io: add a Trusted Publisher to the physure crate: repo
#      Alexisrx96/physure, workflow core-release.yml, environment crates-io.
#   2. GitHub: create the `crates-io` environment (Settings -> Environments).
name: Core Release

on:
  push:
    tags: ["core-v*", "py-core-v*"]

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Tag must match workspace.package.version
        run: |
          tag="${GITHUB_REF_NAME#py-core-v}"
          tag="${tag#core-v}"
          version="$(grep -Po '(?<=^version     = ")[^"]*' Cargo.toml)"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME (parsed $tag) does not match workspace version $version" >&2
            exit 1
          fi

  publish:
    needs: check-version
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish physure crate
        run: cargo publish -p physure
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Prebuilt `phs` + `physure-lsp` binaries so scripts/install.* don't require
  # Rust on the end user's machine, and so the physure-lsp binary lands on
  # PATH automatically (picked up by the vsc-physure extension's LSP client).
  # linux-aarch64 builds natively on GitHub's hosted arm64 runner, so it
  # needs no cross-compilation toolchain.
  phs-binaries:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,     target: x86_64-unknown-linux-gnu,  name: phs-linux-x86_64 }
          - { runner: ubuntu-24.04-arm,  target: aarch64-unknown-linux-gnu, name: phs-linux-aarch64 }
          - { runner: macos-latest,      target: x86_64-apple-darwin,       name: phs-macos-x86_64 }
          - { runner: macos-latest,      target: aarch64-apple-darwin,      name: phs-macos-aarch64 }
          - { runner: windows-latest,    target: x86_64-pc-windows-msvc,    name: phs-windows-x86_64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build phs
        run: cargo build --release -p physure-cli --bin phs --target ${{ matrix.target }}
      - name: Build physure-lsp
        run: cargo build --release -p physure-lsp --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar -czf "dist/${{ matrix.name }}.tar.gz" -C "target/${{ matrix.target }}/release" phs physure-lsp
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/phs.exe","target/${{ matrix.target }}/release/physure-lsp.exe" -DestinationPath "dist/${{ matrix.name }}.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}
          path: dist

  # Permanent GitHub Release pinned to the core tag, with prebuilt phs binaries attached.
  github-release:
    needs: [publish, phs-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: phs-*
          merge-multiple: true
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "physure crate $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
