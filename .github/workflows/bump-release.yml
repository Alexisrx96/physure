# Manually-triggered version bump: computes the next version, bumps
# physure-python/physure/__init__.py, commits, tags `vX.Y.Z`, and pushes. The
# tag push then triggers release.yml, which builds and publishes to PyPI.
#
# physure-core has its own independent version and release flow — see
# bump-core-release.yml / core-release.yml (tags `core-vX.Y.Z`).
name: Bump and Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "physure version part to bump"
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Bump physure version
        id: bump
        run: |
          current="$(grep -Po '(?<=__version__ = ")[^"]*' physure-python/physure/__init__.py)"
          IFS=. read -r major minor patch <<< "$current"
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          new="$major.$minor.$patch"
          sed -i "s/__version__ = \"$current\"/__version__ = \"$new\"/" physure-python/physure/__init__.py
          sed -i "s/^version     = \"$current\"/version     = \"$new\"/" physure-python/pyproject.toml
          echo "new=$new" >> "$GITHUB_OUTPUT"

      - name: Commit, tag, and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add physure-python/physure/__init__.py physure-python/pyproject.toml
          git commit -m "chore: release v${{ steps.bump.outputs.new }}"
          git tag "v${{ steps.bump.outputs.new }}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "v${{ steps.bump.outputs.new }}"
