name: Tests & Benchmarks

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Build Rust, Test Workspace Crates, Check Quality & Package Stripped ABI3 Wheel
  build-and-test-rust:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: dtolnay/rust-toolchain@stable

    - name: Rust build cache
      uses: Swatinem/rust-cache@v2
      continue-on-error: true

    - name: Install uv & Python 3.12
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Python Quality Checks
      run: |
        cd physure-python
        uv sync --all-extras --dev --python 3.12
        uv run ruff check .
        uv run ruff format --check .

    - name: Test All Rust Workspace Crates
      run: cargo test -p physure -p physure-script -p physure-cli -p physure-lsp

    - name: Prebuild Stripped ABI3 PyO3 Wheel
      run: |
        cd physure-python
        uv run maturin build --release --strip --out dist

    - name: Upload PyO3 Wheel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pyo3-wheel
        path: physure-python/dist/*.whl
        retention-days: 1

  # 2. Fast Python Matrix Testing (Uses prebuilt stripped ABI3 wheel; no Rust compiler needed)
  test-python:
    needs: build-and-test-rust
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    env:
      MPLBACKEND: "Agg"

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Download Prebuilt PyO3 Wheel
      uses: actions/download-artifact@v4
      with:
        name: pyo3-wheel
        path: physure-python/dist

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies & prebuilt wheel
      run: |
        cd physure-python
        uv sync --all-extras --dev --python ${{ matrix.python-version }}
        uv pip install dist/*.whl --force-reinstall --python ${{ matrix.python-version }}

    - name: Run Pytest
      run: |
        cd physure-python
        if [ "${{ matrix.python-version }}" = "3.12" ]; then
          uv run pytest --ignore=tests/core/test_serialization.py
        else
          uv run pytest --ignore=tests/core/test_serialization.py \
            --ignore=tests/test_rust_transcendental_delegation.py
        fi

    - name: Build Documentation (Python 3.12 only)
      if: matrix.python-version == '3.12'
      run: |
        cd physure-python
        uv run mkdocs build --strict
