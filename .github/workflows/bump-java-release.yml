# Manually-triggered version bump for physure-java: bumps the version in
# physure-java/pom.xml, commits, tags `java-vX.Y.Z`, and pushes. The tag
# push then triggers java-release.yml, which publishes to Maven Central.
#
# physure-java has its own independent version from the Rust core and
# Python wrapper — see bump-core-release.yml / bump-release.yml.
name: Bump and Release Java

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "physure-java version part to bump"
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Bump physure-java version
        id: bump
        run: |
          current="$(grep -m1 -oP '(?<=<version>)[^<]+' physure-java/pom.xml)"
          IFS=. read -r major minor patch <<< "$current"
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          new="$major.$minor.$patch"
          sed -i "0,/<version>$current<\/version>/s//<version>$new<\/version>/" physure-java/pom.xml
          echo "new=$new" >> "$GITHUB_OUTPUT"

      - name: Commit, tag, and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add physure-java/pom.xml
          git commit -m "chore: release java-v${{ steps.bump.outputs.new }}"
          git tag "java-v${{ steps.bump.outputs.new }}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "java-v${{ steps.bump.outputs.new }}"
