# Release pipeline: push a tag `wasm-vX.Y.Z` to publish the `physure-wasm`
# bindings (physure-wasm/) to npm as the `physure` package.
#
# physure-wasm is versioned independently from the Rust core, Python wrapper,
# and Java bindings (see core-release.yml / release.yml / java-release.yml).
#
# The tag is made by bump-wasm-release.yml (manual trigger): it brings package.json to the
# workspace version, commits, tags `wasm-vX.Y.Z` and starts this workflow. Run it after
# bump-core-release.yml, because physure-wasm has no version of its own.
#
# One-time setup (repo owner):
#   1. On npmjs.com -> package `physure` -> Settings -> Trusted Publisher,
#      configure GitHub Actions with:
#        - Organization or user: Alexisrx96
#        - Repository: physure
#        - Workflow filename: wasm-release.yml
#        - Environment name: npm
#   2. GitHub: ensure the `npm` environment exists (Settings -> Environments).
#      No NPM_TOKEN secret is needed when OIDC Trusted Publishing is active.
name: WASM Release

on:
  push:
    tags: ["wasm-v*"]
  workflow_dispatch:
    # Started by the bump workflow (`gh workflow run ... --ref <tag>`). Run from a branch by hand,
    # the check-version job fails (the ref is not a tag of the right version) before anything is built.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# the engine identity (frozen configurations, spec section 7) names the commit the pipeline says it built
env:
  PHYSURE_BUILD_COMMIT: ${{ github.sha }}

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Tag must match Cargo.toml and package.json version
        run: |
          tag="${GITHUB_REF_NAME#wasm-v}"
          
          # Check physure-wasm/Cargo.toml (or workspace root Cargo.toml if workspace inherited)
          version="$(grep -m1 -oP '(?<=^version = ")[^"]+' physure-wasm/Cargo.toml || true)"
          if [ -z "$version" ]; then
            if grep -m1 -q 'version.workspace *= *true' physure-wasm/Cargo.toml; then
              version="$(grep -m1 -oP '(?<=^version     = ")[^"]+' Cargo.toml)"
            fi
          fi
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME (parsed $tag) does not match Cargo.toml version $version" >&2
            exit 1
          fi

          # Check physure-wasm/package.json
          pkg_version="$(grep -m1 -oP '(?<="version": ")[^"]+' physure-wasm/package.json || true)"
          if [ "$tag" != "$pkg_version" ]; then
            echo "Tag $GITHUB_REF_NAME (parsed $tag) does not match package.json version $pkg_version" >&2
            exit 1
          fi

  # The binding tests (bindings.yml: the golden file, run against the real native library or the wasm
  # build) must pass on this commit before anything is published.
  bindings-tests:
    needs: check-version
    uses: ./.github/workflows/bindings.yml

  publish:
    needs: [check-version, bindings-tests]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Ensure npm supports OIDC Trusted Publishing (>=11.5.1)
        run: npm install -g npm@latest
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build bundler target
        working-directory: physure-wasm
        run: |
          wasm-pack build --release --target bundler --out-dir pkg-bundler
          rm -f pkg-bundler/.gitignore pkg-bundler/package.json
      - name: Build nodejs target
        working-directory: physure-wasm
        run: |
          wasm-pack build --release --target nodejs --out-dir pkg-node
          rm -f pkg-node/.gitignore pkg-node/package.json
      - name: Publish to npm
        working-directory: physure-wasm
        run: npm publish --provenance --access public
